<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVA Kindergarten</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #ffffff;
    background: linear-gradient(180deg, #ffffff 0%, #f6fbff 100%);
    animation: bg-fade 1.8s ease forwards;
  }

  .splash {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .splash-logo {
    position: relative;
    width: min(46vw, 260px);
    height: auto;
    opacity: 0;
    transform: translateY(40px) scale(0.8);
    animation:
      logo-enter 1.8s cubic-bezier(.22, 1, .36, 1) forwards,
      logo-float 4.8s ease-in-out 1.8s infinite;
    will-change: transform, opacity;
  }

  /* 진입 애니메이션: 아래 -> 위로 떠오르며 opacity 0 -> 1, scale 0.8 -> 1 */
  @keyframes logo-enter {
    from { opacity: 0; transform: translateY(40px) scale(0.8); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 진입 이후: 위아래로 12px 정도 둥실둥실 무한 반복 (transform만 사용) */
  @keyframes logo-float {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-12px) scale(1); }
  }

  @keyframes bg-fade {
    from { background-color: #ffffff; }
    to   { background-color: #f6fbff; }
  }

  @media (max-width: 560px) {
    .splash-logo { width: min(58vw, 220px); }
  }
</style>
</head>
<body>

  <div class="splash">
    <img class="splash-logo" src="images/lava-logo.png" alt="LAVA Kindergarten 로고">
  </div>

  <script>
    // 로고 PNG 로드 실패 시를 대비한 안전장치 (콘솔 경고만 남기고 레이아웃은 그대로 유지)
    (function () {
      var logo = document.querySelector('.splash-logo');
      logo.addEventListener('error', function () {
        console.warn('LAVA 로고 이미지를 불러오지 못했습니다: ' + logo.src);
      });
    })();
  </script>

</body>
</html>
